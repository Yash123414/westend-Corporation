server {
    server_name acornpensyexports.com www.acornpensyexports.com;

    location / {
        root /var/www/westend-Corporation/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=3600";
    }

    location /api {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media {
        alias /var/www/westend-Corporation/backend/media;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /static {
        alias /var/www/westend-Corporation/backend/staticfiles;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Additional security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/acornpensyexports.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/acornpensyexports.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}server {
    if ($host = www.acornpensyexports.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = acornpensyexports.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name acornpensyexports.com www.acornpensyexports.com;
    return 404; # managed by Certbot




}